<script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13028348,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById("canvas");
      const progress = document.getElementById("status-progress");
      const text = document.getElementById("status-text");
      const loading = document.getElementById("loading");
      const notice = document.getElementById("loading-notice");
      const retry = document.getElementById("retry");
      retry.addEventListener("click", () => window.location.reload());
      const onProgress = (current, total) => {
        if (Number.isFinite(total) && total > 0) { progress.max = total; progress.value = current; text.textContent = current >= total ? "Abrindo gabinete..." : `${Math.floor(current / total * 100)}%`; }
        else { progress.removeAttribute("value"); text.textContent = "Carregando instituições..."; }
      };
      const fail = (error) => { console.error("[game-loading] Startup failed", error); notice.hidden = false; notice.textContent = "Não foi possível abrir a campanha."; retry.hidden = false; };
      const start = async () => {
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(", ")}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          requestAnimationFrame(() => requestAnimationFrame(() => { loading.hidden = true; canvas.focus(); }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement("script");
      script.src = "index.js";
      script.addEventListener("load", start, { once: true });
      script.addEventListener("error", () => fail(new Error("Engine script could not be loaded")), { once: true });
      document.head.appendChild(script);
    })();
  </script>
